<div class="curso-list-container">
  <table mat-table [dataSource]="cursos">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let curso">{{ curso.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef>Categoria</th>
      <td mat-cell *matCellDef="let curso">
        {{ curso.categoria }}
        <mat-icon>
          {{ curso.categoria | category }}
        </mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-mini-fab color="primary" aria-label="add" class="add-icon">
          <mat-icon (click)="onAdd()">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let curso">
        <button mat-mini-fab color="accent" class="action-column">
          <mat-icon (click)="onEdit(curso)">edit</mat-icon>
        </button>
        <button mat-mini-fab color="warn" class="action-column">
          <mat-icon (click)="onDelete(curso)">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>
</div>
