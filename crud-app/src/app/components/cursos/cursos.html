<mat-card>
  <mat-toolbar color="primary">
    <span>Cursos disponíveis</span>
  </mat-toolbar>

  <div class="column-flex mat-elevation-z8">
    @if (cursos$ | async; as cursos) {

      @if (cursos.length > 0) {
        <app-curso-list [cursos]="cursos" (add)="onAdd()" (edit)="onEdit($event)" (delete)="onDelete($event)"></app-curso-list>
      }

    } @else {
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    }
  </div>
</mat-card>
