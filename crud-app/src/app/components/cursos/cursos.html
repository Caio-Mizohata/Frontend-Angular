<mat-card>
  <mat-toolbar color="primary">
    <span>Cursos disponíveis</span>
  </mat-toolbar>

  @if (cursos$ | async; as cursos) {

  @if (cursos.length > 0) {
  <div>
    <table mat-table [dataSource]="cursos" class="mat-elevation-z8">

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let curso">{{ curso.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let curso">
          {{ curso.categoria }}
          <mat-icon>
            {{ curso.categoria | category }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button mat-mini-fab color="primary" aria-label="add">
            <mat-icon (click)="onAdd()">add</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let curso">
          <button mat-mini-fab color="accent">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-mini-fab color="warn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
  </div>
  } @else {
  <div class="empty-state">
    <p>Nenhum curso encontrado</p>
    <button mat-mini-fab color="primary" aria-label="add" (click)="onAdd()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  }

  } @else {
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
  }
</mat-card>
