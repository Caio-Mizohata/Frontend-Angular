<mat-card>
  <mat-toolbar color="primary">
    <span>Cursos disponíveis</span>
  </mat-toolbar>
  @if (cursos$ | async) {
  <div>
    <table mat-table [dataSource]="(cursos$ | async) || []" class="mat-elevation-z8">

      <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

      <!-- Position Column -->

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let curso"> {{curso.nome}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> Categoria </th>
        <td mat-cell *matCellDef="let curso"> {{curso.categoria}}
          <mat-icon aria-hidden="false" aria-label="Example home icon">{{curso.categoria | category}}</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button mat-mini-fab color="primary" aria-label="add">
            <mat-icon (click)="onAdd()">add</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let curso">
          <button mat-mini-fab color="accent" aria-label="edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-mini-fab color="warn" aria-label="delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
  </div>
  } @else {
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
  }
</mat-card>
